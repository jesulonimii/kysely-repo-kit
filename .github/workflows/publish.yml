# Stages an npm release when a version tag like v1.2.3 is pushed.
name: Publish

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  # Required for npm trusted publishing and provenance.
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # npm stage needs npm 11.15.0 or later, so pin a known version.
      - run: npm install -g npm@11.21.0

      - run: pnpm install --frozen-lockfile

      - name: Check tag matches package.json version
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - run: pnpm build

      # Stages the release for maintainer approval on npmjs.com; auth comes from OIDC trusted publishing.
      - run: npm stage publish --provenance --access public
