# Publishes to npm when a version tag like v1.2.3 is pushed.
name: Publish

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  # Required for npm trusted publishing and provenance.
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      # Trusted publishing needs npm 11.5.1 or later, which ships with Node 24.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Check tag matches package.json version
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - run: pnpm build

      # Auth comes from OIDC trusted publishing, so no NPM_TOKEN secret is needed.
      - run: npm publish --provenance --access public
